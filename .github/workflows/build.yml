name: Build Desktop Game
on: [push, workflow_dispatch]

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Custom Package Structure
        run: |
          # Force clean package initialization
          echo '{"name": "html5game", "version": "1.0.0", "author": "Player", "description": "My Game", "main": "main.js"}' > package.json
          
          # Create an flawless desktop container window script
          echo "const { app, BrowserWindow } = require('electron');" > main.js
          echo "function createWindow () { const win = new BrowserWindow({ width: 800, height: 600, autoHideMenuBar: true, webPreferences: { nodeIntegration: false } }); win.loadFile('index.html'); }" >> main.js
          echo "app.whenReady().then(createWindow);" >> main.js
          
          # Clean install compiler packages locally
          npm install electron@latest @electron/packager@latest --save-dev

      - name: Compile Standalone Windows EXE
        run: |
          # Run compilation with direct script execution to avoid terminal boundary errors
          npx electron-packager . MyGame --platform=win32 --arch=x64 --out=dist --overwrite --no-prune

      - name: Zip and Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: MyGame-Windows-Package
          path: dist/
