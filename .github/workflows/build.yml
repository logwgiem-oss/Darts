name: Build Pure Portable EXE
on: [push, workflow_dispatch]

jobs:
  release:
    name: Build Single Portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Pure Portable Settings
        run: |
          # Force configure package.json to pack as a completely unzipped, single-file PORTABLE target
          echo '{"name": "myportablegame", "version": "1.0.0", "author": "Player", "description": "My Portable Game", "main": "main.js", "scripts": {"build": "electron-builder --win portable"}, "build": {"appId": "com.portable.game", "win": {"target": [{"target": "portable", "arch": ["x64"]}]}}}' > package.json
          
          # Create the native boot script
          echo "const { app, BrowserWindow } = require('electron'); function createWindow () { const win = new BrowserWindow({ width: 800, height: 600, autoHideMenuBar: true }); win.loadFile('index.html'); } app.whenReady().then(createWindow);" > main.js
          
          # Install light dependencies
          npm install electron@latest electron-builder@latest --save-dev

      - name: Run Portable Compiler
        run: npm run build

      - name: Upload Clean Standalone EXE File
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Portable-Game
          path: dist/*.exe
